name: Music Assistant (YouTube Music Family)
version: "2.11.0b9"
slug: music_assistant_ytmusic_family
description: >-
  Music Assistant Server 2.11.0b2 with the "YouTube Music (Family)" provider
  baked in. One-time cookie login per family member, shared library for party
  use, offline playlist downloads. No PO tokens, ad-free streaming.
url: https://music-assistant.io
arch:
  - amd64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: experimental
image: ghcr.io/peraltagroup/ma-ytmusic-family
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
